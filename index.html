
<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration</title>
  <script
  src="https://cdn.c360a.salesforce.com/beacon/c360a/58345f27-146b-4e73-a7e1-6d39c1f7abcb/scripts/c360a.min.js">
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      padding: 40px 16px;
    }
    .container {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0001;
    }
    label { display: block; margin-top: 15px; }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 11px;
      margin-top: 7px;
    }
    button {
      margin-top: 22px;
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
    #message { margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Customer Registration</h2>
    <p>Submit your details to register your interest.</p>

    <form id="customerForm">
      <label for="name">Full Name</label>
      <input id="name" name="name" required>

      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" required>

      <label for="phone">Phone Number</label>
      <input id="phone" name="phone" type="tel">

      <label for="interest">Product Interest</label>
      <select id="interest" name="interest" required>
        <option value="">Select a product</option>
        <option value="Laptop">Laptop</option>
        <option value="Mobile">Mobile</option>
        <option value="Tablet">Tablet</option>
      </select>

      <button type="submit">Submit Details</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script>
    document.getElementById("customerForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const customer = {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          interest: document.getElementById("interest").value
        };

        // Demo only: this does not save or send data to Data Cloud.
        console.log("Form submission:", customer);

        document.getElementById("message").textContent =
          "Form submitted successfully for this demo!";

        this.reset();
      });
  </script>
</body>
</html>
